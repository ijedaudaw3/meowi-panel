<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل ادمین</title>
    <style>
        body { font-family: Tahoma; background: #111; color: #eee; padding: 30px; }
        table { width: 100%; border-collapse: collapse; background: #222; }
        th, td { padding: 10px; border: 1px solid #333; text-align: center; }
        th { background: #ff4444; }
        a { color: #4fc3f7; }
    </style>
</head>
<body>
    <h1>👑 پنل ادمین</h1>
    <table>
        <tr>
            <th>ID</th><th>یوزرنیم</th><th>UUID</th><th>حجم کل</th><th>مصرف</th><th>انقضا</th>
        </tr>
        {% for u in users %}
        <tr>
            <td>{{ u['id'] }}</td>
            <td>{{ u['username'] }}</td>
            <td>{{ u['uuid'][:8] }}...</td>
            <td>{{ u['data_limit'] // 1024**3 }} GB</td>
            <td>{{ u['used'] // 1024**3 }} GB</td>
            <td>{{ u['expire_at'] }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/">بازگشت به صفحه اصلی</a>
    <p>پشتیبانی: {{ support }}</p>
</body>
</html>
